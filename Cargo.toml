[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/build-tools",
    "crates/cli-bridge"
]

[workspace.package]
version = "0.1.0-beta"
edition = "2021"
authors = ["DevForge Team"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
